<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#000;--surface:#111;--surface2:#1a1a1a;--surface3:#232323;
--card:#141414;--card-h:#1c1c1c;
--text:#f5f5f7;--text2:#8e8e93;--text3:#48484a;
--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.04);
--w10:rgba(255,255,255,.10);--w5:rgba(255,255,255,.05);--w3:rgba(255,255,255,.03);
--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{
font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;
background:var(--bg);color:var(--text);
-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent;
user-select:none;-webkit-user-select:none;
}

/* ===== SCREENS ===== */
.scr{
position:fixed;inset:0;display:flex;flex-direction:column;
opacity:0;transform:scale(.97) translateY(8px);
pointer-events:none;
transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
will-change:opacity,transform;
}
.scr.on{opacity:1;transform:none;pointer-events:all}
.scr.out-l{opacity:0;transform:translateX(-20%) scale(.96)}
.scr.out-r{opacity:0;transform:translateX(20%)}

/* ===== WELCOME ===== */
#welcome{justify-content:center;align-items:center;padding:40px 30px;overflow:hidden}
.w-bg{position:absolute;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform}
.o1{width:260px;height:260px;background:rgba(255,255,255,.035);top:12%;left:-8%;animation:of1 14s ease-in-out infinite}
.o2{width:320px;height:320px;background:rgba(255,255,255,.025);bottom:8%;right:-12%;animation:of2 18s ease-in-out infinite}
.o3{width:180px;height:180px;background:rgba(255,255,255,.02);top:50%;left:50%;transform:translate(-50%,-50%);animation:of3 11s ease-in-out infinite}
@keyframes of1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35px,-45px) scale(1.12)}66%{transform:translate(-25px,25px) scale(.94)}}
@keyframes of2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-45px,35px) scale(1.06)}66%{transform:translate(25px,-35px) scale(1.12)}}
@keyframes of3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.22)}}
.w-cnt{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.w-emoji{font-size:68px;animation:wEm 1s cubic-bezier(.34,1.56,.64,1) .3s both}
@keyframes wEm{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.w-title{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.15;animation:fUp .8s cubic-bezier(.22,1,.36,1) .5s both}
.w-sub{font-size:17px;color:var(--text2);line-height:1.55;max-width:300px;animation:fUp .8s cubic-bezier(.22,1,.36,1) .7s both}
@keyframes fUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.w-btn{
margin-top:36px;padding:17px 54px;
background:var(--text);color:var(--bg);border:none;border-radius:16px;
font-size:17px;font-weight:600;cursor:pointer;
transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s;
animation:fUp .8s cubic-bezier(.22,1,.36,1) .9s both;
}
.w-btn:active{transform:scale(.94);opacity:.88}

/* ===== SUBJECTS ===== */
#subjects{padding:56px 20px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-hdr{text-align:center;margin-bottom:30px}
.s-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.s-sub{font-size:15px;color:var(--text2)}
.s-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
.s-chip{
padding:11px 18px;border-radius:22px;
border:1.5px solid var(--border);background:var(--surface);
color:var(--text2);font-size:15px;font-weight:500;
cursor:pointer;
transition:all .38s cubic-bezier(.22,1,.36,1);
}
.s-chip.sel{background:var(--text);color:var(--bg);border-color:var(--text);transform:scale(1.03)}
.s-chip:active{transform:scale(.92)}
.s-chip .chip-em{margin-right:6px}
.s-done{
display:block;width:100%;max-width:360px;margin:20px auto 0;
padding:17px;background:var(--surface2);color:var(--text3);
border:none;border-radius:16px;font-size:17px;font-weight:600;
cursor:pointer;transition:all .38s cubic-bezier(.22,1,.36,1);
}
.s-done.ok{background:var(--text);color:var(--bg)}
.s-done:active{transform:scale(.97)}

/* ===== APP ===== */
#app{display:flex;flex-direction:column;height:100%}
.a-hdr{padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:12px}
.ava{
width:42px;height:42px;border-radius:50%;
background:var(--surface2);display:flex;align-items:center;justify-content:center;
font-size:18px;font-weight:600;color:var(--text2);overflow:hidden;flex-shrink:0;
}
.ava img{width:100%;height:100%;object-fit:cover}
.hdr-greet{font-size:15px;color:var(--text2);line-height:1.3}
.hdr-greet strong{color:var(--text);font-weight:600}
.hdr-set{
width:42px;height:42px;border-radius:50%;
background:var(--surface);border:none;color:var(--text2);
font-size:20px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
transition:all .3s;flex-shrink:0;
}
.hdr-set:active{transform:scale(.88);background:var(--surface2)}

/* Status Banner */
.st-ban{
margin:14px 20px 0;padding:14px 16px;
background:var(--surface);border-radius:16px;border:1px solid var(--border2);
flex-shrink:0;animation:fUp .5s cubic-bezier(.22,1,.36,1) both;
transition:all .5s ease;
}
.st-ban.cur{border-color:rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.015))}
.st-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.st-lbl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.st-time{font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.st-subj{font-size:17px;font-weight:600;margin-bottom:10px;line-height:1.3}
.st-subj.small{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:0}
.prog{height:4px;background:var(--w5);border-radius:2px;overflow:hidden}
.prog-f{height:100%;background:var(--text);border-radius:2px;transition:width 1s linear;will-change:width}

/* Day Tabs */
.dt-wrap{padding:14px 0 0;flex-shrink:0}
.dt-row{display:flex;gap:6px;padding:0 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dt-row::-webkit-scrollbar{display:none}
.dt{
flex-shrink:0;padding:9px 14px;border-radius:14px;
background:var(--surface);border:1px solid transparent;
color:var(--text2);font-size:14px;font-weight:500;
cursor:pointer;transition:all .38s cubic-bezier(.22,1,.36,1);
display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;
}
.dt .dn{font-size:13px;font-weight:600;letter-spacing:.3px}
.dt .dd{font-size:11px;color:var(--text3);font-weight:400}
.dt.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dt.on .dd{color:rgba(0,0,0,.45)}
.dt.today:not(.on){border-color:rgba(255,255,255,.12)}
.dt:active{transform:scale(.92)}

/* Lessons */
.lc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;padding-bottom:calc(24px + var(--safe-b))}
.lc::-webkit-scrollbar{display:none}
.ll{display:flex;flex-direction:column;gap:8px}

.lcard{
position:relative;display:flex;align-items:stretch;
background:var(--surface);border-radius:16px;border:1px solid var(--border2);
overflow:hidden;
animation:cIn .55s cubic-bezier(.22,1,.36,1) both;
transition:background .3s,border-color .3s,opacity .5s,transform .3s;
}
.lcard:active{transform:scale(.98);background:var(--card-h)}
@keyframes cIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.lcard.cur{border-color:rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 0 40px rgba(255,255,255,.025)}
.lcard.cur::before{
content:'';position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.25) 50%,transparent 95%);
animation:shimmer 4s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.9}}
.lcard.past{opacity:.35}
.lcard.skip{opacity:.22}

.lt-col{padding:14px 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:60px;flex-shrink:0}
.lt-n{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.lcard.cur .lt-n{color:var(--text2)}
.lt-s{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.lt-e{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}

.l-div{width:2px;margin:12px 0 12px 12px;background:var(--border);border-radius:1px;flex-shrink:0;transition:background .3s}
.lcard.cur .l-div{background:rgba(255,255,255,.3)}

.l-info{flex:1;padding:12px 12px 12px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.l-subj{font-size:16px;font-weight:600;line-height:1.3;margin-bottom:1px}
.l-room{font-size:12px;color:var(--text3)}
.l-cd{font-size:12px;font-weight:600;color:var(--text2);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.lcard.cur .l-cd{color:var(--text)}
.l-cd .dot{width:5px;height:5px;border-radius:50%;background:var(--text);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.l-hw-p{font-size:12px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.l-act{display:flex;align-items:center;padding-right:12px;flex-shrink:0}
.hw-b{
width:38px;height:38px;border-radius:12px;
background:var(--w5);border:none;color:var(--text3);
cursor:pointer;display:flex;align-items:center;justify-content:center;
transition:all .3s;
}
.hw-b:active{transform:scale(.82)}
.hw-b.has{color:var(--text);background:var(--w10)}
.hw-b svg{width:18px;height:18px}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;animation:fUp .5s cubic-bezier(.22,1,.36,1) both}
.empty-em{font-size:60px;margin-bottom:16px}
.empty-t{font-size:20px;font-weight:600;margin-bottom:6px}
.empty-s{font-size:15px;color:var(--text2)}

/* Mini progress on card */
.l-prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--w3)}
.l-prog-f{height:100%;background:rgba(255,255,255,.25);border-radius:0 2px 2px 0;transition:width 1s linear}

/* ===== OVERLAY & SHEETS ===== */
.ov{
position:fixed;inset:0;background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
z-index:100;opacity:0;pointer-events:none;transition:opacity .38s ease;
}
.ov.vis{opacity:1;pointer-events:all}
.bsheet{
position:fixed;left:0;right:0;bottom:0;
background:#1c1c1e;border-radius:22px 22px 0 0;
z-index:101;transform:translateY(100%);
transition:transform .5s cubic-bezier(.22,1,.36,1);
max-height:85vh;display:flex;flex-direction:column;
}
.bsheet.open{transform:translateY(0)}
.sh-handle{width:36px;height:5px;background:rgba(255,255,255,.18);border-radius:3px;margin:10px auto 0;flex-shrink:0}
.sh-hdr{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sh-t{font-size:20px;font-weight:600}
.sh-x{
width:30px;height:30px;border-radius:50%;
background:rgba(255,255,255,.1);border:none;color:var(--text2);
font-size:15px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
transition:all .3s;
}
.sh-x:active{transform:scale(.82)}
.sh-body{padding:0 20px 16px;flex:1;overflow-y:auto}
.sh-li{font-size:14px;color:var(--text2);margin-bottom:12px}
.hw-ta{
width:100%;min-height:130px;
background:rgba(255,255,255,.04);border:1px solid var(--border);
border-radius:14px;padding:14px;color:var(--text);
font-size:16px;font-family:inherit;resize:vertical;outline:none;
transition:border-color .3s;
}
.hw-ta:focus{border-color:rgba(255,255,255,.2)}
.hw-ta::placeholder{color:var(--text3)}
.sh-acts{padding:10px 20px;padding-bottom:calc(12px + var(--safe-b));display:flex;gap:10px;flex-shrink:0}
.sh-btn{
flex:1;padding:15px;border-radius:14px;border:none;
font-size:16px;font-weight:600;cursor:pointer;
transition:all .3s cubic-bezier(.22,1,.36,1);font-family:inherit;
}
.sh-btn:active{transform:scale(.96)}
.sh-btn-s{background:var(--text);color:var(--bg)}
.sh-btn-d{background:rgba(255,59,48,.13);color:#ff453a;flex:.45}

/* Settings */
.set-item{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border2)}
.set-item:last-child{border-bottom:none}
.set-lbl{font-size:16px}
.set-btn{
padding:9px 18px;border-radius:11px;
background:var(--w10);border:none;color:var(--text);
font-size:14px;font-weight:500;cursor:pointer;
transition:all .3s;font-family:inherit;
}
.set-btn:active{transform:scale(.92)}
.set-btn.dng{color:#ff453a;background:rgba(255,59,48,.12)}

/* Toast */
.toast{
position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
padding:12px 24px;background:var(--surface3);
border:1px solid var(--border);border-radius:14px;
font-size:14px;font-weight:500;color:var(--text);
z-index:200;pointer-events:none;
transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s;
opacity:0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- WELCOME -->
<div class="scr" id="welcome">
  <div class="w-bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="w-cnt">
    <div class="w-emoji">📚</div>
    <h1 class="w-title" id="wTitle">Привет!</h1>
    <p class="w-sub">Твоё расписание уроков — всегда&nbsp;под&nbsp;рукой. Удобно, быстро&nbsp;и&nbsp;красиво.</p>
    <button class="w-btn" onclick="goSubjects()">Начать</button>
  </div>
</div>

<!-- SUBJECTS -->
<div class="scr" id="subjects">
  <div class="s-hdr">
    <h2 class="s-title">Твои предметы</h2>
    <p class="s-sub">Выбери те, на которые ходишь</p>
  </div>
  <div class="s-grid" id="sGrid"></div>
  <button class="s-done" id="sDone" onclick="finishSetup()">Готово</button>
</div>

<!-- APP -->
<div class="scr" id="app">
  <div class="a-hdr" id="aHdr"></div>
  <div class="st-ban" id="stBan"></div>
  <div class="dt-wrap"><div class="dt-row" id="dtRow"></div></div>
  <div class="lc"><div class="ll" id="ll"></div></div>
</div>

<!-- OVERLAY -->
<div class="ov" id="ov" onclick="closeSheet()"></div>

<!-- HW SHEET -->
<div class="bsheet" id="hwSh">
  <div class="sh-handle"></div>
  <div class="sh-hdr"><h3 class="sh-t">Домашнее задание</h3><button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <p class="sh-li" id="hwLi"></p>
    <textarea class="hw-ta" id="hwTa" placeholder="Запиши домашнее задание…"></textarea>
  </div>
  <div class="sh-acts">
    <button class="sh-btn sh-btn-d" id="hwDel" onclick="delHw()">Удалить</button>
    <button class="sh-btn sh-btn-s" onclick="saveHw()">Сохранить</button>
  </div>
</div>

<!-- SETTINGS SHEET -->
<div class="bsheet" id="setSh">
  <div class="sh-handle"></div>
  <div class="sh-hdr"><h3 class="sh-t">Настройки</h3><button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <div class="set-item"><span class="set-lbl">Изменить предметы</span><button class="set-btn" onclick="resetSubj()">Изменить</button></div>
    <div class="set-item"><span class="set-lbl">Очистить все ДЗ</span><button class="set-btn dng" onclick="clearHw()">Очистить</button></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

{id:"physics",name:"Физика",em:"⚛️"},
{id:"cs",name:"Информатика",em:"💻"},
{id:"choreo",name:"Хореография",em:"💃"}
];

const ALIAS={"Рус. яз":"russian","Инф":"cs","Математика (П)":"math_p","Математика (Б)":"math_b",
"Русский язык":"russian","Математика (профиль)":"math_p","Математика (база)":"math_b",
"Англ. язык":"english","История":"history","Обществознание":"social",
"Физика":"physics","Информатика":"cs","Хореография":"choreo"};

const ALWAYS=["Кл. час","Обед","Физ-ра","—"];

/* ===== STATE ===== */
let selSubj=JSON.parse(localStorage.getItem("selSubj")||"[]");
let hw=JSON.parse(localStorage.getItem("hw")||"{}");
let onboarded=localStorage.getItem("onboarded")==="true";
let curDay=todayKey();
let activeSheet=null;
let hwEditKey=null;
let timerInt=null;

/* ===== TELEGRAM ===== */
const tg=window.Telegram&&window.Telegram.WebApp;
let uName="Ученик",uPhoto=null;

function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t||"light")}catch(e){}}

/* ===== INIT ===== */
function init(){
  if(tg){
    tg.ready();tg.expand();
    try{tg.setHeaderColor("#000000")}catch(e){}
    try{tg.setBackgroundColor("#000000")}catch(e){}
    const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u){uName=u.first_name||"Ученик";uPhoto=u.photo_url||null}
  }
  document.getElementById("wTitle").textContent="Привет, "+uName+"!";
  if(onboarded&&selSubj.length){showScr("app");initApp()}
  else{showScr("welcome")}
}

/* ===== SCREENS ===== */
let curScr=null;
function showScr(id){
  document.querySelectorAll(".scr").forEach(s=>{
    if(s.id===id){s.classList.add("on");s.classList.remove("out-l","out-r")}
    else{
      if(s.classList.contains("on")){s.classList.remove("on");s.classList.add("out-l")}
    }
  });
  curScr=id;
}

function goSubjects(){haptic("medium");showScr("subjects");renderChips()}
function finishSetup(){
  if(!selSubj.length)return;
  haptic("medium");
  localStorage.setItem("selSubj",JSON.stringify(selSubj));
  localStorage.setItem("onboarded","true");
  onboarded=true;
  showScr("app");initApp();
}

/* ===== SUBJECT CHIPS ===== */
function renderChips(){
  const g=document.getElementById("sGrid");
  g.innerHTML="";
  SUBJ_LIST.forEach((s,i)=>{
    const c=document.createElement("div");
    c.className="s-chip"+(selSubj.includes(s.id)?" sel":"");
    c.innerHTML='<span class="chip-em">'+s.em+'</span>'+s.name;
    c.style.animationDelay=i*50+"ms";
    c.style.animation="fUp .5s cubic-bezier(.22,1,.36,1) both";
    c.style.animationDelay=(.1+i*.05)+"s";
    c.onclick=()=>{
      haptic("light");
      const idx=selSubj.indexOf(s.id);
      if(idx>=0)selSubj.splice(idx,1);else selSubj.push(s.id);
      c.classList.toggle("sel");
      updDone();
    };
    g.appendChild(c);
  });
  updDone();
}
function updDone(){
  const b=document.getElementById("sDone");
  b.classList.toggle("ok",selSubj.length>0);
  b.textContent=selSubj.length?"Готово ("+selSubj.length+")":"Выбери хотя бы один";
}

/* ===== APP INIT ===== */
function initApp(){renderHdr();renderDays();renderLessons();startTimer()}

/* ===== HEADER ===== */
function renderHdr(){
  const h=document.getElementById("aHdr");
  const avaInner=uPhoto?'<img src="'+uPhoto+'" alt="">':uName.charAt(0).toUpperCase();
  h.innerHTML='<div class="hdr-l"><div class="ava">'+avaInner+'</div><div class="hdr-greet"><strong>'+uName+'</strong><br>'+todayStr()+'</div></div><button class="hdr-set" onclick="openSettings()">⚙</button>';
}
function todayStr(){
  const d=new Date();
  const mo=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const wd=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
  return wd[d.getDay()]+", "+d.getDate()+" "+mo[d.getMonth()];
}

/* ===== DAY TABS ===== */
function renderDays(){
  const r=document.getElementById("dtRow");
  r.innerHTML="";
  const dates=weekDates();
  const tk=todayKey();
  DKEYS.forEach(k=>{
    const t=document.createElement("div");
    t.className="dt"+(k===curDay?" on":"")+(k===tk?" today":"");
    t.innerHTML='<span class="dn">'+k+'</span><span class="dd">'+dates[k]+'</span>';
    t.onclick=()=>{haptic("light");curDay=k;renderDays();renderLessons();updateStatus()};
    r.appendChild(t);
  });
  setTimeout(()=>{
    const act=r.querySelector(".on");
    if(act)act.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  },100);
}

function weekDates(){
  const t=new Date();const d=t.getDay();
  const mon=new Date(t);mon.setDate(t.getDate()-(d===0?6:d-1));
  const res={};
  DKEYS.forEach((k,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);res[k]=x.getDate()});
  return res;
}

/* ===== LESSONS ===== */
function renderLessons(){
  const c=document.getElementById("ll");
  c.innerHTML="";
  const lessons=SCHED[curDay]||[];
  if(!lessons.length){
    c.innerHTML='<div class="empty"><div class="empty-em">😴</div><div class="empty-t">Выходной</div><div class="empty-s">Никаких уроков, отдыхай!</div></div>';
    return;
  }
  const now=nowMin();
  const isToday=curDay===todayKey();
  let num=0;
  lessons.forEach((l,i)=>{
    const disp=displaySubj(l.subject);
    const isSkip=disp==="—";
    const isLunch=l.subject==="Обед";
    if(!isLunch&&!isSkip)num++;
    const {start,end}=parseRange(l.time);
    const isCur=isToday&&now>=start&&now<end;
    const isPast=isToday&&now>=end;

    const card=document.createElement("div");
    card.className="lcard"+(isCur?" cur":"")+(isPast?" past":"")+(isSkip?" skip":"");
    card.style.animationDelay=(i*.055)+"s";

    const times=l.time.split(/[–—-]/);
    const ts=times[0]?.trim()||"";
    const te=times[1]?.trim()||"";

    let numLabel="";
    if(isLunch)numLabel="🍽";
    else if(isSkip)numLabel="—";
    else numLabel=num+" урок";

    let cdHtml="";
    if(isToday&&!isSkip){
      if(isCur){
        const left=end-now;
        cdHtml='<div class="l-cd"><span class="dot"></span> Осталось '+fmtMin(left)+'</div>';
      }else if(!isPast){
        const till=start-now;
        if(till>0&&till<=120)cdHtml='<div class="l-cd">Через '+fmtMin(till)+'</div>';
      }
    }

    const hk=curDay+"_"+i;
    const hasHw=!!hw[hk];
    const hwPrev=hasHw?'<div class="l-hw-p">📝 '+escHtml(hw[hk].substring(0,40))+(hw[hk].length>40?"…":"")+'</div>':"";

    let progHtml="";
    if(isCur){
      const pct=Math.min(100,((now-start)/(end-start))*100);
      progHtml='<div class="l-prog"><div class="l-prog-f" style="width:'+pct.toFixed(1)+'%"></div></div>';
    }

    card.innerHTML=
      '<div class="lt-col"><div class="lt-n">'+numLabel+'</div><div class="lt-s">'+ts+'</div><div class="lt-e">'+te+'</div></div>'+
      '<div class="l-div"></div>'+
      '<div class="l-info"><div class="l-subj">'+escHtml(disp)+'</div>'+(l.room?'<div class="l-room">'+escHtml(l.room)+'</div>':'')+cdHtml+hwPrev+'</div>'+
      (isSkip?'':'<div class="l-act"><button class="hw-b'+(hasHw?' has':'')+'" onclick="event.stopPropagation();openHw(\''+hk+'\',\''+escAttr(disp)+'\',\''+escAttr(l.time)+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button></div>')+
      progHtml;

    c.appendChild(card);
  });

  if(isToday){
    const cur=c.querySelector(".cur");
    if(cur)setTimeout(()=>cur.scrollIntoView({behavior:"smooth",block:"center"}),400);
  }
}

/* ===== STATUS ===== */
function startTimer(){if(timerInt)clearInterval(timerInt);updateStatus();timerInt=setInterval(()=>{updateStatus();if(curDay===todayKey())updateCards()},1000)}

function updateStatus(){
  const ban=document.getElementById("stBan");
  const tk=todayKey();
  const lessons=SCHED[tk]||[];
  if(!lessons.length){ban.className="st-ban";ban.innerHTML='<div class="st-subj small">Сегодня выходной 😴</div>';return}

  const now=nowMin();
  let curL=null,nextL=null,curI=-1;
  for(let i=0;i<lessons.length;i++){
    const {start,end}=parseRange(lessons[i].time);
    if(now>=start&&now<end){curL=lessons[i];curI=i;break}
    if(now<start&&!nextL){nextL=lessons[i];break}
  }

  if(curL){
    const {start,end}=parseRange(curL.time);
    const left=end-now;
    const pct=Math.min(100,((now-start)/(end-start))*100);
    const ds=displaySubj(curL.subject);
    ban.className="st-ban cur";
    ban.innerHTML='<div class="st-top"><span class="st-lbl">Сейчас</span><span class="st-time">Осталось '+fmtMin(left)+'</span></div><div class="st-subj">'+escHtml(ds)+'</div><div class="prog"><div class="prog-f" style="width:'+pct.toFixed(1)+'%"></div></div>';
  }else if(nextL){
    const {start}=parseRange(nextL.time);
    const till=start-now;
    const ds=displaySubj(nextL.subject);
    ban.className="st-ban";
    ban.innerHTML='<div class="st-top"><span class="st-lbl">Перемена</span><span class="st-time">Через '+fmtMin(till)+'</span></div><div class="st-subj">'+escHtml(ds)+'</div>';
  }else{
    const first=lessons[0];
    const {start}=parseRange(first.time);
    if(now<start){
      const till=start-now;
      ban.className="st-ban";
      ban.innerHTML='<div class="st-top"><span class="st-lbl">До начала</span><span class="st-time">'+fmtMin(till)+'</span></div><div class="st-subj small">Первый урок — '+escHtml(displaySubj(first.subject))+'</div>';
    }else{
      ban.className="st-ban";
      ban.innerHTML='<div class="st-subj small">Уроки закончились 🎉</div>';
    }
  }
}

function updateCards(){
  if(curDay!==todayKey())return;
  const cards=document.querySelectorAll(".lcard");
  const now=nowMin();
  const lessons=SCHED[curDay]||[];
  cards.forEach((card,i)=>{
    if(i>=lessons.length)return;
    const {start,end}=parseRange(lessons[i].time);
    const wasCur=card.classList.contains("cur");
    const isCur=now>=start&&now<end;
    const isPast=now>=end;

    if(isCur&&!wasCur){card.classList.add("cur");card.classList.remove("past")}
    if(!isCur&&wasCur){card.classList.remove("cur")}
    if(isPast&&!card.classList.contains("past")){card.classList.add("past")}

    // Update countdown text
    const cdEl=card.querySelector(".l-cd");
    if(isCur){
      const left=end-now;
      if(cdEl)cdEl.innerHTML='<span class="dot"></span> Осталось '+fmtMin(left);
      const pf=card.querySelector(".l-prog-f");
      if(pf){const pct=Math.min(100,((now-start)/(end-start))*100);pf.style.width=pct.toFixed(1)+"%"}
      else{
        // Add progress bar if not exists
        if(!card.querySelector(".l-prog")){
          const pct=Math.min(100,((now-start)/(end-start))*100);
          card.insertAdjacentHTML("beforeend",'<div class="l-prog"><div class="l-prog-f" style="width:'+pct.toFixed(1)+'%"></div></div>');
        }
      }
    }else if(!isPast&&now<start){
      const till=start-now;
      if(cdEl&&till<=120)cdEl.textContent="Через "+fmtMin(till);
    }
  });
}

/* ===== HOMEWORK ===== */
function openHw(key,subj,time){
  haptic("light");
  hwEditKey=key;
  document.getElementById("hwLi").textContent=subj+" • "+time;
  document.getElementById("hwTa").value=hw[key]||"";
  document.getElementById("hwDel").style.display=hw[key]?"block":"none";
  openSheet("hwSh");
  setTimeout(()=>document.getElementById("hwTa").focus(),400);
}
function saveHw(){
  const v=document.getElementById("hwTa").value.trim();
  if(v){hw[hwEditKey]=v}else{delete hw[hwEditKey]}
  localStorage.setItem("hw",JSON.stringify(hw));
  haptic("medium");closeSheet();renderLessons();toast("Сохранено ✓");
}
function delHw(){
  delete hw[hwEditKey];
  localStorage.setItem("hw",JSON.stringify(hw));
  haptic("medium");closeSheet();renderLessons();toast("Удалено");
}

/* ===== SETTINGS ===== */
function openSettings(){haptic("light");openSheet("setSh")}
function resetSubj(){
  closeSheet();
  setTimeout(()=>{
    localStorage.removeItem("onboarded");
    onboarded=false;
    showScr("subjects");
    renderChips();
  },350);
}
function clearHw(){
  hw={};localStorage.setItem("hw",JSON.stringify(hw));
  haptic("medium");closeSheet();renderLessons();toast("Все ДЗ очищены");
}

/* ===== SHEETS ===== */
function openSheet(id){
  activeSheet=id;
  document.getElementById("ov").classList.add("vis");
  document.getElementById(id).classList.add("open");
}
function closeSheet(){
  document.getElementById("ov").classList.remove("vis");
  if(activeSheet){document.getElementById(activeSheet).classList.remove("open");activeSheet=null}
}

/* ===== TOAST ===== */
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

/* ===== UTILS ===== */
function todayKey(){const d=["ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"];return d[new Date().getDay()]}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function parseRange(s){
  const p=s.split(/[–—-]/);
  const a=p[0].trim().split(":").map(Number);
  const b=p[1].trim().split(":").map(Number);
  return{start:a[0]*60+a[1],end:b[0]*60+b[1]};
}
function fmtMin(m){
  m=Math.ceil(m);
  if(m>=60){const h=Math.floor(m/60);const mm=m%60;return h+" ч"+(mm?" "+mm+" мин":"")}
  return m+" мин";
}
function displaySubj(raw){
  if(ALWAYS.includes(raw))return raw;
  if(!raw.includes("/"))return raw;
  const parts=raw.split("/").map(s=>s.trim());
  const matched=parts.filter(p=>{const id=ALIAS[p];return id&&selSubj.includes(id)});
  return matched.length===1?matched[0]:raw;
}
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escAttr(s){return s.replace(/'/g,"\\'")}

/* ===== START ===== */
document.addEventListener("DOMContentLoaded",init);
</script>
