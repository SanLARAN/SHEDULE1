<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--surface:#111;--surface2:#1a1a1a;--surface3:#232323;--text:#f5f5f7;--text2:#8e8e93;--text3:#48484a;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.04);--w10:rgba(255,255,255,.10);--w5:rgba(255,255,255,.05);--w3:rgba(255,255,255,.03);--red:#ff453a;--blue:#64d2ff;--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

/* ═══════════════════════════════════════════
   CINEMATIC SPLASH
   ═══════════════════════════════════════════ */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1),filter .8s cubic-bezier(.4,0,.2,1)}
.splash.out{opacity:0;transform:scale(.85);filter:blur(20px);pointer-events:none}
.splash.gone{display:none}
.sp-scene{position:absolute;inset:0;overflow:hidden}

/* ── Text Reveal ── */
.sp-cnt{position:relative;z-index:10;text-align:center;display:flex;flex-direction:column;align-items:center}
.sp-row{overflow:hidden;padding:2px 0}
.sp-row-inner{transform:translateY(120%);opacity:0;filter:blur(8px);transition:transform .9s cubic-bezier(.22,1,.36,1) var(--d),opacity .7s ease var(--d),filter .8s ease var(--d)}
.splash.active .sp-row-inner{transform:translateY(0);opacity:1;filter:blur(0)}
.sp-greet{font-size:36px;font-weight:700;letter-spacing:-.8px;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sp-name{font-size:44px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin-top:2px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sp-divider{width:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);margin:24px 0;transition:width .7s cubic-bezier(.22,1,.36,1) var(--d)}
.splash.active .sp-divider{width:56px}
.sp-date{font-size:16px;font-weight:500;color:var(--text2);letter-spacing:-.2px}
.sp-stats{font-size:15px;font-weight:500;color:var(--text3);margin-top:6px}
.sp-skip{position:absolute;bottom:calc(44px + var(--safe-b));left:0;right:0;text-align:center;font-size:13px;color:var(--text3);opacity:0;letter-spacing:.3px;transition:opacity .6s ease var(--d)}
.splash.active .sp-skip{opacity:.3}

/* ── Shared Glow ── */
.sp-glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:0;will-change:transform,opacity}
.splash.active .sp-glow{transition:opacity 1.5s ease var(--gd,.2s),transform 2.5s cubic-bezier(.22,1,.36,1) var(--gd,.2s)}

/* ══════════════════════
   🌙 NIGHT SCENE
   ══════════════════════ */
.sp-gn1{width:300px;height:300px;background:rgba(40,60,180,.06);top:30%;left:20%;transform:translate(-50%,-50%) scale(.5)}
.splash.active .sp-gn1{opacity:1;transform:translate(-50%,-50%) scale(1);animation:gBr 6s ease-in-out 2.5s infinite}
.sp-gn2{width:220px;height:220px;background:rgba(80,40,160,.05);bottom:20%;right:15%;transform:scale(.5);--gd:.4s}
.splash.active .sp-gn2{opacity:1;transform:scale(1);animation:gBr 8s ease-in-out 3s infinite}
@keyframes gBr{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* Stars */
.sp-star{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);opacity:0}
.splash.active .sp-star{animation:twinkle var(--dur) ease-in-out var(--del) infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.85;transform:scale(1.1)}}

/* Comet */
.sp-comet{position:absolute;top:14%;left:90%;height:2px;width:160px;background:linear-gradient(90deg,rgba(210,225,255,.95) 0%,rgba(170,200,255,.45) 12%,rgba(120,160,255,.12) 35%,transparent 100%);transform:rotate(33deg);opacity:0;border-radius:1px}
.sp-comet::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 25%,rgba(200,220,255,.7) 55%,transparent);box-shadow:0 0 8px 3px rgba(200,220,255,.9),0 0 20px 8px rgba(120,160,255,.4),0 0 40px 15px rgba(80,120,255,.15)}
.splash.active .sp-comet{animation:cometFly 2.8s cubic-bezier(.12,.7,.3,1) 2s forwards}
@keyframes cometFly{0%{transform:rotate(33deg) translateX(0);opacity:0}4%{opacity:1}65%{opacity:.5}100%{transform:rotate(33deg) translateX(calc(-115vw));opacity:0}}

/* ══════════════════════
   🌅 MORNING SCENE
   ══════════════════════ */
.sp-gm1{width:400px;height:250px;background:rgba(255,140,40,.07);bottom:18%;left:50%;transform:translateX(-50%) scale(.6);--gd:.15s;filter:blur(100px)}
.splash.active .sp-gm1{opacity:1;transform:translateX(-50%) scale(1);animation:gBr 7s ease-in-out 3s infinite}
.sp-m-horizon{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,rgba(255,120,30,.1) 0%,rgba(255,160,60,.05) 25%,rgba(255,100,40,.02) 50%,transparent 100%);opacity:0}
.splash.active .sp-m-horizon{opacity:1;transition:opacity 1.5s ease .15s}

/* Sun */
.sp-m-sun{position:absolute;left:50%;bottom:30%;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,rgba(255,225,140,1) 0%,rgba(255,195,70,.65) 40%,rgba(255,160,40,.2) 70%,transparent 100%);box-shadow:0 0 30px 12px rgba(255,175,55,.3),0 0 80px 35px rgba(255,130,25,.1);transform:translateX(-50%) translateY(70px);opacity:0}
.splash.active .sp-m-sun{animation:sunRise 2.8s cubic-bezier(.22,1,.36,1) .45s forwards}
@keyframes sunRise{0%{transform:translateX(-50%) translateY(70px);opacity:0}15%{opacity:.6}100%{transform:translateX(-50%) translateY(0);opacity:1}}

/* Rays */
.sp-ray{position:absolute;left:calc(50% - .75px);bottom:34%;width:1.5px;height:0;background:linear-gradient(to top,rgba(255,200,100,.14),rgba(255,220,150,.03),transparent);transform-origin:bottom center;filter:blur(1px)}
.splash.active .sp-ray{animation:rayUp 1s ease-out var(--d) forwards}
@keyframes rayUp{to{height:var(--h)}}

/* ══════════════════════
   ☀️ DAY SCENE
   ══════════════════════ */
.sp-gd1{width:350px;height:350px;background:rgba(255,255,255,.04);top:10%;left:50%;transform:translateX(-50%) scale(.5);filter:blur(110px);--gd:.2s}
.splash.active .sp-gd1{opacity:1;transform:translateX(-50%) scale(1);animation:gBr 8s ease-in-out 2.5s infinite}

.sp-d-sun{position:absolute;top:18%;left:50%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 25%,rgba(255,250,235,.6) 55%,transparent);box-shadow:0 0 20px 10px rgba(255,255,255,.18),0 0 60px 30px rgba(255,255,240,.07),0 0 140px 60px rgba(255,255,220,.03);transform:translateX(-50%) scale(.4);opacity:0}
.splash.active .sp-d-sun{animation:dSunBloom 2s cubic-bezier(.22,1,.36,1) .4s forwards}
@keyframes dSunBloom{0%{transform:translateX(-50%) scale(.4);opacity:0}55%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}

.sp-d-rays{position:absolute;top:18%;left:50%;width:320px;height:320px;transform:translateX(-50%) translateY(-45%);border-radius:50%;background:repeating-conic-gradient(transparent 0deg,transparent 13.5deg,rgba(255,255,255,.012) 13.5deg,rgba(255,255,255,.012) 16deg);-webkit-mask:radial-gradient(circle,transparent 28px,#000 65px);mask:radial-gradient(circle,transparent 28px,#000 65px);opacity:0}
.splash.active .sp-d-rays{opacity:1;transition:opacity 1.5s ease 1s;animation:dRayRot 60s linear 1s infinite}
@keyframes dRayRot{to{transform:translateX(-50%) translateY(-45%) rotate(360deg)}}

/* ══════════════════════
   🌆 EVENING SCENE
   ══════════════════════ */
.sp-e-sky{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(50,15,70,.1) 0%,rgba(130,35,70,.06) 35%,rgba(200,70,35,.08) 65%,rgba(255,110,35,.06) 100%);opacity:0}
.splash.active .sp-e-sky{opacity:1;transition:opacity 1.8s ease .15s}

.sp-ge1{width:350px;height:200px;background:rgba(255,100,30,.06);bottom:15%;left:50%;transform:translateX(-50%) scale(.5);filter:blur(100px);--gd:.3s}
.splash.active .sp-ge1{opacity:1;transform:translateX(-50%) scale(1);animation:gBr 7s ease-in-out 3s infinite}

.sp-e-sun{position:absolute;bottom:22%;left:50%;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,rgba(255,155,55,1) 0%,rgba(255,115,25,.55) 40%,rgba(255,80,15,.15) 70%,transparent 100%);box-shadow:0 0 40px 15px rgba(255,115,25,.22),0 0 100px 45px rgba(255,75,15,.06);transform:translateX(-50%) scale(.7);opacity:0}
.splash.active .sp-e-sun{animation:eSunIn 2.2s cubic-bezier(.22,1,.36,1) .5s forwards}
@keyframes eSunIn{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* Floating particles */
.sp-mote{position:absolute;border-radius:50%;background:rgba(255,175,70,.35);opacity:0}
.splash.active .sp-mote{animation:moteF var(--dur) ease-in-out var(--del) infinite}
@keyframes moteF{0%,100%{transform:translate(0,0);opacity:.08}30%{opacity:.45}50%{transform:translate(var(--dx),var(--dy));opacity:.3}70%{opacity:.12}}

/* ═══════════════════════════════════════════
   APP STYLES
   ═══════════════════════════════════════════ */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transform:scale(.97) translateY(8px);pointer-events:none;transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}.scr.on{opacity:1;transform:none;pointer-events:all}.scr.out-l{opacity:0;transform:translateX(-20%) scale(.96)}
#welcome{justify-content:center;align-items:center;padding:40px 30px;overflow:hidden}
.w-bg{position:absolute;inset:0;z-index:0}.orb{position:absolute;border-radius:50%;filter:blur(110px)}.o1{width:260px;height:260px;background:rgba(255,255,255,.035);top:12%;left:-8%;animation:of1 14s ease-in-out infinite}.o2{width:320px;height:320px;background:rgba(255,255,255,.025);bottom:8%;right:-12%;animation:of2 18s ease-in-out infinite}.o3{width:180px;height:180px;background:rgba(255,255,255,.02);top:50%;left:50%;transform:translate(-50%,-50%);animation:of3 11s ease-in-out infinite}
@keyframes of1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35px,-45px) scale(1.12)}66%{transform:translate(-25px,25px) scale(.94)}}@keyframes of2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-45px,35px) scale(1.06)}66%{transform:translate(25px,-35px) scale(1.12)}}@keyframes of3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.22)}}
.w-cnt{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}.w-emoji{font-size:68px;animation:wEm 1s cubic-bezier(.34,1.56,.64,1) .3s both}@keyframes wEm{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.w-title{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.15;animation:fUp .8s cubic-bezier(.22,1,.36,1) .5s both}.w-sub{font-size:17px;color:var(--text2);line-height:1.55;max-width:300px;animation:fUp .8s cubic-bezier(.22,1,.36,1) .7s both}@keyframes fUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}.w-btn{margin-top:36px;padding:17px 54px;background:var(--text);color:var(--bg);border:none;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s;animation:fUp .8s cubic-bezier(.22,1,.36,1) .9s both}.w-btn:active{transform:scale(.94);opacity:.88}
#subjects,#groupSel{padding:56px 20px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch}.s-hdr{text-align:center;margin-bottom:30px}.s-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}.s-sub{font-size:15px;color:var(--text2);line-height:1.5;max-width:320px;margin:0 auto}.s-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}.s-chip{padding:11px 18px;border-radius:22px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:15px;font-weight:500;cursor:pointer;transition:all .38s cubic-bezier(.22,1,.36,1)}.s-chip.sel{background:var(--text);color:var(--bg);border-color:var(--text);transform:scale(1.03)}.s-chip:active{transform:scale(.92)}.s-chip .chip-em{margin-right:6px}.s-done{display:block;width:100%;max-width:360px;margin:20px auto 0;padding:17px;background:var(--surface2);color:var(--text3);border:none;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;transition:all .38s cubic-bezier(.22,1,.36,1);font-family:inherit}.s-done.ok{background:var(--text);color:var(--bg)}.s-done:active{transform:scale(.97)}
.g-wrap{display:flex;gap:14px;max-width:360px;margin:0 auto 28px}.g-card{flex:1;padding:28px 16px;border-radius:20px;background:var(--surface);border:2px solid var(--border);text-align:center;cursor:pointer;transition:all .42s cubic-bezier(.22,1,.36,1);overflow:hidden}.g-card.sel{border-color:var(--text);background:rgba(255,255,255,.06);transform:scale(1.02)}.g-card:active{transform:scale(.96)}.g-num{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:4px;color:var(--text3);transition:color .3s}.g-card.sel .g-num{color:var(--text)}.g-label{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}.g-days{font-size:14px;color:var(--text2);font-weight:500}.g-card.sel .g-days{color:var(--text)}
#app{display:flex;flex-direction:column;height:100%}.a-hdr{padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.hdr-l{display:flex;align-items:center;gap:12px}.ava{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--text2);overflow:hidden;flex-shrink:0}.ava img{width:100%;height:100%;object-fit:cover}.hdr-info{display:flex;flex-direction:column;gap:1px}.hdr-greet{font-size:17px;font-weight:600;line-height:1.3}.hdr-date{font-size:13px;color:var(--text2);line-height:1.3}.hdr-set{width:42px;height:42px;border-radius:50%;background:var(--surface);border:none;color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}.hdr-set:active{transform:scale(.88);background:var(--surface2)}
.nl-widget{margin:12px 20px 0;padding:12px 16px;background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border-radius:16px;border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:12px;flex-shrink:0;transition:opacity .4s,max-height .5s,margin .4s,padding .4s;overflow:hidden;max-height:100px}.nl-widget.hidden{opacity:0;max-height:0;margin-top:0;padding-top:0;padding-bottom:0;pointer-events:none}.nl-icon{width:40px;height:40px;border-radius:12px;background:var(--w10);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.nl-cnt{flex:1;min-width:0}.nl-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:2px}.nl-subj{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nl-meta{font-size:12px;color:var(--text2)}.nl-time{font-size:22px;font-weight:700;color:var(--text);flex-shrink:0;letter-spacing:-.5px}
.st-ban{margin:12px 20px 0;padding:14px 16px;background:var(--surface);border-radius:16px;border:1px solid var(--border2);flex-shrink:0;transition:all .5s ease}.st-ban.cur{border-color:rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.015))}.st-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}.st-lbl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}.st-time{font-size:12px;font-weight:700;color:var(--text)}.st-subj{font-size:17px;font-weight:600;margin-bottom:10px;line-height:1.3}.st-subj.small{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:0}.prog{height:4px;background:var(--w5);border-radius:2px;overflow:hidden}.prog-f{height:100%;background:var(--text);border-radius:2px;transition:width 1s linear}
.dt-wrap{padding:14px 0 0;flex-shrink:0}.dt-row{display:flex;gap:6px;padding:0 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.dt-row::-webkit-scrollbar{display:none}.dt{flex-shrink:0;padding:9px 14px;border-radius:14px;background:var(--surface);border:1px solid transparent;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .38s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px}.dt .dn{font-size:13px;font-weight:600;letter-spacing:.3px}.dt .dd{font-size:11px;color:var(--text3)}.dt.on{background:var(--text);color:var(--bg);border-color:var(--text)}.dt.on .dd{color:rgba(0,0,0,.45)}.dt.today:not(.on){border-color:rgba(255,255,255,.12)}.dt:active{transform:scale(.92)}
.swipe-area{flex:1;overflow:hidden;position:relative}.swipe-track{display:flex;width:100%;height:100%;transition:transform .45s cubic-bezier(.22,1,.36,1)}.swipe-track.dragging{transition:none}.swipe-panel{width:100%;flex-shrink:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;padding-bottom:calc(24px + var(--safe-b))}.swipe-panel::-webkit-scrollbar{display:none}

function getSubjEmoji(raw){const parts=raw.split("/").map(s=>s.trim());for(const p of parts){const id=ALIAS[p];if(id){const s=SUBJ_LIST.find(x=>x.id===id);if(s)return s.em}}if(raw.includes("Обед"))return"🍽";if(raw.includes("Физ-ра"))return"🏃";if(raw.includes("Кл. час"))return"📋";return"📖"}
function startTimer(){if(timerInt)clearInterval(timerInt);updateStatus();updateNextWidget();timerInt=setInterval(()=>{updateStatus();updateNextWidget();updateLiveCards()},1000)}
function updateStatus(){const ban=document.getElementById("stBan"),tk=todayKey(),lessons=SCHED[tk]||[];if(!lessons.length){ban.className="st-ban";ban.innerHTML='<div class="st-subj small">Сегодня выходной 😴</div>';return}const now=nowMin();let curL=null,nextL=null;for(let i=0;i<lessons.length;i++){const{start,end}=parseRange(lessons[i].time);const ovr=getOvr(tk,i);if(ovr&&ovr.type==="remove")continue;const d=ovr&&ovr.type==="replace"?ovr.subject:resolveSubj(tk,lessons[i].subject);if(now>=start&&now<end&&d!=="—"){curL={lesson:lessons[i],disp:d};break}if(now<start&&!nextL&&d!=="—"){nextL={lesson:lessons[i],disp:d};break}}if(curL){const{start,end}=parseRange(curL.lesson.time);const left=end-now,pct=Math.min(100,((now-start)/(end-start))*100);ban.className="st-ban cur";ban.innerHTML='<div class="st-top"><span class="st-lbl">Сейчас</span><span class="st-time">Осталось '+fmtMin(left)+'</span></div><div class="st-subj">'+escHtml(curL.disp)+'</div><div class="prog"><div class="prog-f" style="width:'+pct.toFixed(1)+'%"></div></div>'}else if(nextL){const{start}=parseRange(nextL.lesson.time);ban.className="st-ban";ban.innerHTML='<div class="st-top"><span class="st-lbl">Перемена</span><span class="st-time">Через '+fmtMin(start-now)+'</span></div><div class="st-subj">'+escHtml(nextL.disp)+'</div>'}else{const f=lessons[0];const{start}=parseRange(f.time);if(now<start){ban.className="st-ban";ban.innerHTML='<div class="st-top"><span class="st-lbl">До начала</span><span class="st-time">'+fmtMin(start-now)+'</span></div><div class="st-subj small">Первый урок</div>'}else{ban.className="st-ban";ban.innerHTML='<div class="st-subj small">Уроки закончились 🎉</div>'}}}
function openHw(key,subj,time){haptic("light");hwEditKey=key;document.getElementById("hwLi").textContent=subj+" · "+time;document.getElementById("hwTa").value=hw[key]||"";document.getElementById("hwDel").style.display=hw[key]?"block":"none";openSheet("hwSh");setTimeout(()=>document.getElementById("hwTa").focus(),400)}
function saveHw(){const v=document.getElementById("hwTa").value.trim();if(v)hw[hwEditKey]=v;else delete hw[hwEditKey];localStorage.setItem("hw",JSON.stringify(hw));haptic("medium");closeSheet();refreshAllPanels();toast("Сохранено ✓")}
function delHw(){delete hw[hwEditKey];localStorage.setItem("hw",JSON.stringify(hw));haptic("medium");closeSheet();refreshAllPanels();toast("Удалено")}
function openSettings(){haptic("light");renderSettingsBody();openSheet("setSh")}
function renderSettingsBody(){let h='<div class="set-sep">Интерфейс</div>';h+=mkT("swipeEnabled","👆 Свайп между днями","Листай влево-вправо");h+=mkT("nextWidget","📌 Следующий урок","Виджет ближайшего урока");h+=mkT("dynGreeting","🌅 Приветствие","По времени суток");h+='<div class="set-sep">Группа русского</div><div class="set-item"><div class="set-left"><div class="set-lbl">Группа '+rusGroup+'</div><div class="set-desc">Гр.1: ПН·ВТ·ЧТ — Гр.2: ПН·СР·ЧТ</div></div><div class="seg"><button class="seg-b'+(rusGroup===1?" on":"")+'" onclick="setGroup(1,this)">1</button><button class="seg-b'+(rusGroup===2?" on":"")+'" onclick="setGroup(2,this)">2</button></div></div>';h+='<div class="set-sep">Предметы</div>';SUBJ_LIST.forEach(s=>{const on=selSubj.includes(s.id);h+='<div class="subj-row"><span class="subj-em">'+s.em+'</span><span class="subj-name">'+s.name+'</span><button class="toggle'+(on?" on":"")+'" onclick="toggleSubj(\''+s.id+'\',this)"></button></div>'});h+='<div class="set-sep">Данные</div><div class="set-item"><div class="set-left"><div class="set-lbl">Очистить все ДЗ</div></div><button class="set-btn dng" onclick="clearAllHw()">Очистить</button></div>';document.getElementById("setBody").innerHTML=h}
function mkT(key,label,desc){return'<div class="set-item"><div class="set-left"><div class="set-lbl">'+label+'</div><div class="set-desc">'+desc+'</div></div><button class="toggle'+(settings[key]?" on":"")+'" onclick="toggleSett(\''+key+'\',this)"></button></div>'}
function toggleSett(key,el){haptic("light");settings[key]=!settings[key];el.classList.toggle("on",settings[key]);saveSett();if(key==="nextWidget")updateNextWidget();if(key==="dynGreeting")renderHdr()}
function setGroup(n,el){haptic("light");rusGroup=n;localStorage.setItem("rusGroup",String(n));el.parentElement.querySelectorAll(".seg-b").forEach(b=>b.classList.remove("on"));el.classList.add("on");el.closest(".set-item").querySelector(".set-lbl").textContent="Группа "+n;refreshAllPanels();toast("Группа "+n)}
function toggleSubj(id,el){haptic("light");const x=selSubj.indexOf(id);if(x>=0)selSubj.splice(x,1);else selSubj.push(id);el.classList.toggle("on",selSubj.includes(id));localStorage.setItem("selSubj",JSON.stringify(selSubj));refreshAllPanels()}
function clearAllHw(){hw={};localStorage.setItem("hw",JSON.stringify(hw));haptic("medium");closeSheet();refreshAllPanels();toast("Все ДЗ очищены")}
function openSheet(id){activeSheet=id;document.getElementById("ov").classList.add("vis");document.getElementById(id).classList.add("open")}
function closeSheet(){document.getElementById("ov").classList.remove("vis");if(activeSheet){document.getElementById(activeSheet).classList.remove("open");activeSheet=null}}
function toast(msg,undoFn){const t=document.getElementById("toast");t.innerHTML=escHtml(msg)+(undoFn?'<span class="toast-undo" id="tUndo">Вернуть</span>':"");t.classList.add("show");if(undoFn)setTimeout(()=>{const u=document.getElementById("tUndo");if(u)u.onclick=()=>{undoFn();t.classList.remove("show")}},0);clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),undoFn?5000:2200)}
function todayKey(){return["ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"][new Date().getDay()]}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function parseRange(s){const p=s.split(/[–—-]/);const a=p[0].trim().split(":").map(Number),b=p[1].trim().split(":").map(Number);return{start:a[0]*60+a[1],end:b[0]*60+b[1]}}
function fmtMin(m){m=Math.ceil(m);if(m>=60){const h=Math.floor(m/60),mm=m%60;return h+" ч"+(mm?" "+mm+" мин":"")}return m+" мин"}
function fmtMinShort(m){m=Math.ceil(m);if(m>=60){const h=Math.floor(m/60),mm=m%60;return h+"ч"+(mm?" "+mm+"м":"")}return m+"м"}
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function escAttr(s){return s.replace(/'/g,"\\'")}
document.addEventListener("DOMContentLoaded",init);
</script>
